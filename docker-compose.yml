version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: trialbridge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trialbridge
    ports:
      - "5432:5432"
    volumes:
      - trialbridge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trialbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - trialbridge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: trialbridge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - trialbridge-qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: trialbridge-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - trialbridge-minio-data:/data

  createbuckets:
    image: minio/mc
    container_name: trialbridge-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc rm -r --force myminio/trialbridge-documents || true;
      /usr/bin/mc mb myminio/trialbridge-documents || true;
      /usr/bin/mc anonymous set public myminio/trialbridge-documents || true;
      exit 0;
      "

volumes:
  trialbridge-db-data:
  trialbridge-redis-data:
  trialbridge-qdrant-data:
  trialbridge-minio-data:
